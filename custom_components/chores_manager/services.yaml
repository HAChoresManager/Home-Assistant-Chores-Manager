# De twintig services van de oude app zijn in fase 3c verdwenen en de
# tijdelijke seed in fase 5; alle bediening loopt via de WS-commando's
# (websocket.py). De uitzonderingen zijn mark_done, undo_last,
# revert_completion, skip en revert_skip: dunne lagen zonder eigen logica
# (dezelfde kernen als het panel), omdat Lovelace alleen services kan
# aanroepen en geen WS-commando's. Wat hier staat is het volledige
# service-aanbod.

roll_forward:
  name: Achterstand doorrollen
  description: >-
    Voert de nachtelijke rol van 03:00 nu meteen uit: taken waarvan de
    achterstand voorbij de grens van hun prioriteit is, schuiven door naar
    hun eerstvolgende logische datum (REFACTOR_PLAN.md §4.2). Normaal
    gesproken is deze service niet nodig.

send_daily_summary:
  name: Ochtendmelding nu versturen
  description: >-
    Verstuurt de ochtendmelding van 08:00 nu meteen. Alleen personen met een
    ingevulde meldingsservice, meldingen aan én iets te doen krijgen er één;
    de knop in de melding draagt de naam van de belangrijkste taak.

send_weekly_summary:
  name: Weeksamenvatting nu versturen
  description: >-
    Verstuurt de weeksamenvatting van zondag 20:00 nu meteen, naar iedereen
    met een ingevulde meldingsservice en meldingen aan.

mark_done:
  name: Taak afvinken
  description: >-
    Vinkt een taak af zoals het panel dat doet (zelfde undo-venster van vijf
    minuten, zelfde push). Zonder assignee_id komt de voltooiing op naam van de
    aanroepende HA-gebruiker, mits die aan een persoon gekoppeld is (ha_user_id).
    Bedoeld voor Lovelace-kaarten; een checklist wordt in één keer afgerond,
    een counter krijgt één tik.
  fields:
    chore_id:
      name: Taak
      description: Het id van de taak (zie tasks_today op sensor.chores_overview).
      required: true
      example: badkamer_grondig_schoonmaken
      selector:
        text:
    assignee_id:
      name: Persoon
      description: >-
        Persoon-id (bijv. martijn of laura). Leeg of null = de aanroepende
        gebruiker. Vanuit een automatisering is er geen aanroepende
        gebruiker; geef het dan altijd mee.
      required: false
      example: laura
      selector:
        text:

undo_last:
  name: Laatste actie ongedaan maken
  description: >-
    Draait de laatste voltooiing of overslag exact terug (zelfde venster van
    vijf minuten als de undo-knop in het panel). Daarna is er niets meer om
    terug te draaien. Een overslag gaat niet meer terug als er inmiddels aan
    de taak gewerkt is of de datum gewijzigd is.

revert_completion:
  name: Voltooiing terugdraaien
  description: >-
    Haalt een eerdere voltooiing weg, ook buiten het undo-venster. Was het de
    laatste volledige voltooiing van de taak, dan komt de taak vandaag terug en
    gaat bij een roterende taak de beurt terug naar wie hem had; bij een oudere
    gaat alleen de regel weg. Is de taak daarna overgeslagen, dan blijft de
    datum van die overslag staan en gaat alleen de beurt terug. Bedoeld voor
    de "laatst gedaan"-lijst op een dashboard.
  fields:
    completion_id:
      name: Voltooiing
      description: Het id uit recent_completions op sensor.chores_overview.
      required: true
      example: 412
      selector:
        number:
          min: 1
          mode: box

skip:
  name: Taak overslaan
  description: >-
    Slaat de huidige keer van een taak over: deze keer doet niemand hem. De
    taak schuift door naar de eerstvolgende geplande keer, zonder voltooiing
    (geen minuten, geen invloed op ranglijst of reeks) en bij een roterende
    taak blijft dezelfde persoon aan de beurt. Een half afgevinkte checklist
    of teller begint opnieuw. Alleen voor taken die vandaag aan de beurt zijn
    of achterlopen; zelfde undo-venster van vijf minuten als het panel.
  fields:
    chore_id:
      name: Taak
      description: Het id van de taak (zie tasks_today op sensor.chores_overview).
      required: true
      example: badkamer_grondig_schoonmaken
      selector:
        text:
    assignee_id:
      name: Persoon
      description: >-
        Wie oversloeg (bijv. martijn of laura). Leeg of null = de aanroepende
        gebruiker, als die aan een persoon gekoppeld is; anders blijft het
        onbekend. Overslaan lukt dus ook vanuit een automatisering.
      required: false
      example: laura
      selector:
        text:

revert_skip:
  name: Overslaan terugdraaien
  description: >-
    Toch niet overslaan, ook buiten het undo-venster: de taak krijgt zijn
    datum van vóór het overslaan terug en de regel verdwijnt uit de
    activiteit. Kan alleen zolang er sinds het overslaan niets met de taak is
    gebeurd (niet afgevinkt, niet opnieuw overgeslagen, datum niet gewijzigd).
    Bedoeld voor een "overgeslagen"-lijst op een dashboard.
  fields:
    skip_id:
      name: Overslag
      description: Het id uit recent_skips op sensor.chores_overview.
      required: true
      example: 37
      selector:
        number:
          min: 1
          mode: box
