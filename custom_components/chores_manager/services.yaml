# De twintig services van de oude app zijn in fase 3c verdwenen; alle
# bediening loopt via de WS-commando's (websocket.py). Wat hier staat is
# het volledige service-aanbod.

seed:
  name: Seed (tijdelijk)
  description: >-
    TIJDELIJK — vult de database met de acht taken en drie personen uit de
    oude app. Bestaande rijen met dezelfde id's worden overschreven. Dit
    verdwijnt in fase 5, zodra de taken definitief opnieuw zijn ingevoerd.

roll_forward:
  name: Achterstand doorrollen
  description: >-
    Voert de nachtelijke rol van 03:00 nu meteen uit: taken waarvan de
    achterstand voorbij de grens van hun prioriteit is, schuiven door naar
    hun eerstvolgende logische datum (REFACTOR_PLAN.md §4.2). Normaal
    gesproken is deze service niet nodig.
